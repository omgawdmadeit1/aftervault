<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3d6b5e" />
    <title>AfterVault — Offline</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f5f2;
        --fg: #1a1d21;
        --muted: #5c646c;
        --primary: #3d6b5e;
        --card: #ffffff;
        --border: #e2e0d9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .card {
        width: min(100%, 420px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 28px 24px;
        box-shadow: 0 10px 30px rgb(26 29 33 / 0.05);
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 14px;
        background: var(--primary);
        display: grid;
        place-items: center;
        color: #f7faf8;
        font-weight: 700;
        font-size: 18px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
        font-size: 0.95rem;
      }
      button {
        margin-top: 20px;
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: #f7faf8;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">AV</div>
      <h1>You're offline</h1>
      <p>
        AfterVault needs a connection for a fresh shell. Your vault entries already saved on this
        device will reappear when you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
